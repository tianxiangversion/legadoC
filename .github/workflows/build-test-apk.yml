
name: Build Reading C Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check test package name
        run: |
          grep -q "applicationIdSuffix '.ctest'" app/build.gradle || {
            echo "ERROR: release package suffix is not .ctest"
            exit 1
          }

      - name: Build test APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease --no-daemon --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: reading-c-test-apk
          path: app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error
          retention-days: 7
